<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudlet Map Diff Report</title>
    <link rel="stylesheet" href="report.css">
</head>
<body>
    <aside>
        <div class="sidebar-header">
            <h1>Map Diff Report</h1>
        </div>
        <nav>
            <a href="#summary">Summary</a>
{{NAV_MAP_PROPERTIES}}
            <div class="nav-group">Entities</div>
{{NAV_ROOMS}}
{{NAV_LABELS}}
{{NAV_AREAS}}
        </nav>
    </aside>

    <main>
        <div class="container">
            <div class="controls">
                <button onclick="expandAll()">Expand All</button>
                <button onclick="collapseAll()">Collapse All</button>
                <div style="width: 20px"></div>
                <button onclick="prevChange()">Previous (k)</button>
                <button onclick="nextChange()">Next (j)</button>
                <span id="browse-info" class="kbd-hint" style="display: none;">
                    Item <span id="current-pos" class="current-index">0</span> of <span id="total-count">0</span>
                </span>
                <div class="kbd-hint">
                    Use <kbd>j</kbd>/<kbd>k</kbd> or <kbd>↓</kbd>/<kbd>↑</kbd> to navigate
                </div>
            </div>
{{CONTENT}}
        </div>
    </main>

    <script src="report.js"></script>
</body>
</html>
